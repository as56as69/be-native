<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>إعادة تعيين BeNative</title>
    <style>
      body {
        font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        background: #f3e0bc;
        color: #2e201b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        background: #fff8ea;
        border-radius: 18px;
        padding: 28px 34px;
        box-shadow: 0 8px 26px rgba(46, 32, 27, 0.12);
        max-width: 480px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 1.7; margin: 6px 0; }
      #state { font-weight: 700; color: #8a5a2b; min-height: 22px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>🔄 إعادة تعيين التطبيق</h1>
      <p>عمية مسح الخدمة القديمة والكاش…</p>
      <div id="state">…</div>
      <p style="font-size:13px;color:#7a6a5a">راح يرجع للتطبيق تلقائياً بعد ثانية.</p>
    </div>
    <script src="/reset-sw.js"></script>
  </body>
</html>
